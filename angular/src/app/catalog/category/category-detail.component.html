<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<form [formGroup]="form" skipValidation (ngSubmit)="saveChange()">
  <p-panel #pnl header="Category Detail">
    <div class="grid grid-cols-12 gap-4">
      <div class="col-span-12">
        <label for="name" class="block">Name <span class="required">*</span></label>
        <input
          id="name"
          pInputText
          type="text"
          formControlName="name"
          class="w-full"
          (keyup)="generateSlug()"
        />
        <app-validation-message
          [entityForm]="form"
          fieldName="name"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-12">
        <label for="code" class="block">Code <span class="required">*</span></label>
        <input id="code" pInputText type="text" formControlName="code" class="w-full" />
        <app-validation-message
          [entityForm]="form"
          fieldName="code"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-12">
        <label for="slug" class="block">Slug <span class="required">*</span></label>
        <input id="slug" pInputText type="text" formControlName="slug" class="w-full" />
        <app-validation-message
          [entityForm]="form"
          fieldName="slug"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-12">
        <label for="parentId" class="block">Parent Category <span class="required">*</span></label>
        <p-select
          id="parentId"
          [options]="parentCategories"
          formControlName="parentId"
          placeholder="Select a parent category if available; skip if not"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"
          autoWidth="false"
          [style]="{ width: '100%' }"
        ></p-select>
      </div>

      <div class="col-span-12">
        <label for="sortOrder" class="block">Sort Order <span class="required">*</span></label>
        <p-inputnumber formControlName="sortOrder" class="w-full"></p-inputnumber>
        <app-validation-message
          [entityForm]="form"
          fieldName="sortOrder"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-6">
        <label for="coverPicture" class="block"
          >Cover Picture <span class="required">*</span></label
        >
        <input
          id="coverPicture"
          type="file"
          pInputText
          class="cursor-pointer w-full"
          (change)="onFileChange($event)"
          (blur)="form.get('coverPictureContent')?.markAsTouched()"
        />
      </div>
      <div class="col-span-6">
        <p-image
          [src]="coverPicture"
          [alt]="selectedEntity.name"
          width="100"
          height="100"
          class="rounded-md overflow-hidden"
          [preview]="true"
        />
      </div>
      <div class="col-span-12">
        <app-validation-message
          [entityForm]="form"
          fieldName="coverPictureContent"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-12">
        <label for="seoMetaDescription" class="block">SEO Description</label>
        <textarea
          id="seoMetaDescription"
          pInputTextarea
          class="w-full"
          formControlName="seoMetaDescription"
        ></textarea>
        <app-validation-message
          [entityForm]="form"
          fieldName="seoMetaDescription"
          [validationMessages]="validationMessages"
        ></app-validation-message>
      </div>

      <div class="col-span-12 md:col-span-3">
        <p-checkbox
          formControlName="visibility"
          binary="true"
          id="visibility"
          class="mr-1"
        ></p-checkbox>
        <label for="visibility">Visibility</label>
      </div>

      <div class="col-span-12 md:col-span-3">
        <p-checkbox
          formControlName="isActive"
          binary="true"
          id="isActive"
          class="mr-1"
        ></p-checkbox>
        <label for="isActive">Is Active</label>
      </div>
    </div>

    <ng-template pTemplate="footer">
      <div class="flex justify-end">
        <button
          [disabled]="!form.valid || btnDisabled"
          type="submit"
          pButton
          icon="fa fa-save"
          iconPos="left"
          label="Save"
        ></button>
      </div>
    </ng-template>

    <p-blockui [blocked]="blockedPanel" [target]="pnl">
      <div class="flex justify-center items-center h-full w-full">
        <p-progress-spinner ariaLabel="loading"></p-progress-spinner>
      </div>
    </p-blockui>
  </p-panel>
</form>
