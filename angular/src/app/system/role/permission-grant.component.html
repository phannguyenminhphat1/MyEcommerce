<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<form [formGroup]="form" (ngSubmit)="saveChange()" class="w-full">
  <p-panel #pnl>
    <div class="flex flex-col gap-8">
      <div *ngFor="let group of groups" class="border-b border-gray-200 pb-6">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">
          {{ group.displayName }}
        </h2>
        <div class="grid gap-3">
          <div *ngFor="let permission of group.permissions" class="flex items-center gap-3 pl-2">
            <p-checkbox
              [value]="permission.name"
              [(ngModel)]="selectedPermissions"
              [inputId]="permission.name"
              [ngModelOptions]="{ standalone: true }"
            >
            </p-checkbox>
            <label [for]="permission.name" class="cursor-pointer text-gray-700">
              {{ permission.displayName }}
            </label>
          </div>
        </div>
      </div>
    </div>
    <ng-template pTemplate="footer">
      <div class="flex justify-end gap-2">
        <button
          type="button"
          pButton
          severity="secondary"
          label="Cancel"
          (click)="close()"
        ></button>
        <button type="submit" pButton label="Update" [disabled]="btnDisabled"></button>
      </div>
    </ng-template>
    <p-blockui [blocked]="blockedPanel" [target]="pnl">
      <div class="flex justify-center items-center h-full w-full">
        <p-progress-spinner ariaLabel="loading"></p-progress-spinner>
      </div>
    </p-blockui>
  </p-panel>
</form>
